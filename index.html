<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento autocaravana</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --danger: #dc2626;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 16px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.2rem; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  label {
    display: block;
    font-weight: 600;
    margin: 12px 0 4px;
    font-size: .95rem;
  }
  input, textarea {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 16px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-secondary {
    background: #eef2ff;
    color: var(--accent);
    border: 1px solid var(--accent);
    margin-top: 8px;
  }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .registro {
    border-top: 1px solid var(--border);
    padding: 12px 0;
  }
  .registro:first-of-type { border-top: none; }
  .registro .fila {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .registro .fecha { font-weight: 700; }
  .registro .km, .registro .coste { color: var(--muted); }
  .registro .desc { margin-top: 6px; white-space: pre-wrap; }
  .registro .borrar {
    background: none;
    border: none;
    color: var(--danger);
    font-size: .85rem;
    padding: 4px 0;
    margin-top: 6px;
    width: auto;
    cursor: pointer;
  }
  .vacio { color: var(--muted); text-align: center; padding: 12px 0; }
  .nota {
    font-size: .82rem;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.4;
  }
  .oculto { display: none; }
</style>
</head>
<body>
<header><h1>Mantenimiento de la autocaravana</h1></header>
<main>
  <div class="card">
    <h2>Nuevo mantenimiento</h2>
    <form id="form">
      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" required>

      <label for="km">Kilometraje del vehículo</label>
      <input type="number" id="km" inputmode="numeric" min="0" step="1" placeholder="p. ej. 45230" required>

      <label for="trabajo">Mantenimiento realizado</label>
      <textarea id="trabajo" placeholder="p. ej. Cambio de aceite y filtro" required></textarea>

      <label for="coste">Coste (€)</label>
      <input type="number" id="coste" inputmode="decimal" min="0" step="0.01" placeholder="p. ej. 120.00" required>

      <button type="submit" class="btn-primary">Guardar mantenimiento</button>
    </form>
  </div>

  <div class="card">
    <h2>Historial</h2>
    <div id="lista"></div>
  </div>

  <div class="card">
    <h2>Copia de seguridad</h2>
    <button id="exportar" class="btn-secondary" type="button">Descargar copia (JSON)</button>
    <button id="importarBtn" class="btn-secondary" type="button">Restaurar copia</button>
    <input type="file" id="importar" accept="application/json,.json" class="oculto">
    <p class="nota">Los registros se guardan en este dispositivo. Descarga una copia de vez en cuando para no depender solo de este navegador; con «Restaurar copia» puedes recuperarla aquí o en otro dispositivo.</p>
  </div>
</main>

<script>
(function () {
  var CLAVE = 'mantenimientos_autocaravana';

  function cargar() {
    try {
      var datos = JSON.parse(localStorage.getItem(CLAVE));
      return Array.isArray(datos) ? datos : [];
    } catch (e) { return []; }
  }

  function guardar(lista) {
    localStorage.setItem(CLAVE, JSON.stringify(lista));
  }

  function fmtFecha(iso) {
    var p = iso.split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
  }

  function fmtNumero(n, dec) {
    return Number(n).toLocaleString('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }

  function pintar() {
    var lista = cargar();
    var cont = document.getElementById('lista');
    cont.innerHTML = '';
    if (!lista.length) {
      cont.innerHTML = '<p class="vacio">Todavía no hay mantenimientos registrados.</p>';
      return;
    }
    lista.forEach(function (r, i) {
      var div = document.createElement('div');
      div.className = 'registro';
      var fila = document.createElement('div');
      fila.className = 'fila';
      var fecha = document.createElement('span');
      fecha.className = 'fecha';
      fecha.textContent = fmtFecha(r.fecha);
      var km = document.createElement('span');
      km.className = 'km';
      km.textContent = fmtNumero(r.km, 0) + ' km';
      var coste = document.createElement('span');
      coste.className = 'coste';
      coste.textContent = fmtNumero(r.coste, 2) + ' €';
      fila.appendChild(fecha);
      fila.appendChild(km);
      fila.appendChild(coste);
      var desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = r.trabajo;
      var borrar = document.createElement('button');
      borrar.className = 'borrar';
      borrar.type = 'button';
      borrar.textContent = 'Eliminar';
      borrar.addEventListener('click', function () {
        if (!confirm('¿Eliminar este registro?')) return;
        var l = cargar();
        l.splice(i, 1);
        guardar(l);
        pintar();
      });
      div.appendChild(fila);
      div.appendChild(desc);
      div.appendChild(borrar);
      cont.appendChild(div);
    });
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var registro = {
      fecha: document.getElementById('fecha').value,
      km: Number(document.getElementById('km').value),
      trabajo: document.getElementById('trabajo').value.trim(),
      coste: Number(document.getElementById('coste').value)
    };
    var lista = cargar();
    lista.push(registro);
    lista.sort(function (a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : b.km - a.km; });
    guardar(lista);
    e.target.reset();
    document.getElementById('fecha').valueAsDate = new Date();
    pintar();
  });

  document.getElementById('exportar').addEventListener('click', function () {
    var datos = JSON.stringify(cargar(), null, 2);
    var blob = new Blob([datos], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'mantenimientos-autocaravana.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('importarBtn').addEventListener('click', function () {
    document.getElementById('importar').click();
  });

  document.getElementById('importar').addEventListener('change', function (e) {
    var archivo = e.target.files[0];
    if (!archivo) return;
    var lector = new FileReader();
    lector.onload = function () {
      try {
        var datos = JSON.parse(lector.result);
        if (!Array.isArray(datos)) throw new Error('formato');
        datos = datos.filter(function (r) {
          return r && typeof r.fecha === 'string' && typeof r.trabajo === 'string' &&
                 !isNaN(Number(r.km)) && !isNaN(Number(r.coste));
        });
        guardar(datos);
        pintar();
        alert('Copia restaurada: ' + datos.length + ' registro(s).');
      } catch (err) {
        alert('No se pudo leer la copia. Asegúrate de usar el archivo JSON descargado desde esta app.');
      }
    };
    lector.readAsText(archivo);
    e.target.value = '';
  });

  document.getElementById('fecha').valueAsDate = new Date();
  pintar();
})();
</script>
</body>
</html>
